[package]
name = "aeri"
description = "The Aeri browser application: GPUI shell over CEF."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.cef.bundle]
helper_name = "aeri-helper"

[dependencies]
aeri-core.workspace = true
aeri-cef.workspace = true
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2.workspace = true
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
