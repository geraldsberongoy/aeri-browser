<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Aeri intro</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #000; color: #fff;
        font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .abs { position: absolute; }
      #scene { left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 640px 360px; }
      #light1, #light2 { border-radius: 50%; filter: blur(60px); }
      #light1 { left: 120px; top: 60px; width: 760px; height: 560px;
        background: radial-gradient(closest-side, rgba(255,255,255,.26), rgba(255,255,255,0)); }
      #light2 { left: 640px; top: 300px; width: 700px; height: 520px;
        background: radial-gradient(closest-side, rgba(255,255,255,.13), rgba(255,255,255,0)); }
      #contours { left: -200px; top: 0; width: 1680px; height: 720px; }
      #contours path { fill: none; stroke: #fff; stroke-linecap: round; }
      #vignette { inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 30%, rgba(0,0,0,.72) 100%); }
      #shade { inset: 0; background: radial-gradient(ellipse at 50% 52%, rgba(0,0,0,.5), rgba(0,0,0,0) 55%); }

      #ribbon { left: 135px; top: -129px; width: 1024px; height: 1024px; transform-origin: 505px 524px; opacity: 0; }
      #ink { position: absolute; inset: 0; background: #fff;
        -webkit-mask: url("assets/glyph.png") center / 100% 100% no-repeat;
        mask: url("assets/glyph.png") center / 100% 100% no-repeat; }
      #word { left: 0; right: 0; top: 417px; height: 110px; text-align: center; font-size: 100px; line-height: 110px;
        font-weight: 600; letter-spacing: -0.03em; white-space: nowrap; text-shadow: 0 2px 30px rgba(0,0,0,.55); }
      #word span { display: inline-block; opacity: 0; }
      #fade { inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="aeri-intro" data-start="0" data-width="1280" data-height="720" data-duration="7.4">
      <div id="scene" class="abs">
        <div id="light1" class="abs"></div>
        <div id="light2" class="abs"></div>
        <svg id="contours" class="abs" viewBox="0 0 1680 720" width="1680" height="720"></svg>
        <div id="vignette" class="abs"></div>
        <div id="shade" class="abs"></div>
        <div id="ribbon" class="abs"><div id="ink"></div></div>
        <div id="word" class="abs"><span>A</span><span>e</span><span>r</span><span>i</span></div>
      </div>
      <div id="fade" class="abs"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // Wind-like contour lines: deterministic, drawn once, moved only by the timeline (seek-safe).
      const svg = document.getElementById("contours");
      const NS = "http://www.w3.org/2000/svg";
      const groups = [];
      for (let i = 0; i < 16; i++) {
        const y0 = 40 + i * 42, amp = 14 + (i % 5) * 7, ph = i * 0.9;
        let d = "";
        for (let x = 0; x <= 1680; x += 24) {
          const y = y0 + Math.sin(x / 210 + ph) * amp + Math.sin(x / 90 + ph * 1.7) * amp * 0.3;
          d += (x ? "L" : "M") + x + " " + y.toFixed(1);
        }
        const g = document.createElementNS(NS, "g");
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d);
        p.style.strokeWidth = i % 4 === 0 ? 1.6 : 1;
        p.style.opacity = (0.1 + 0.14 * Math.abs(Math.sin(i * 1.3))).toFixed(2);
        g.appendChild(p); svg.appendChild(g); groups.push(g);
      }

      const tl = gsap.timeline({ paused: true });
      // Living background from frame one (frame 0 already shows light + contours)
      tl.fromTo("#contours", { x: 0 }, { x: -150, duration: 7.4, ease: "none" }, 0);
      groups.forEach((g, i) => tl.fromTo(g, { x: 0, y: 0 }, { x: (i % 2 ? -1 : 1) * (30 + i * 3), y: (i % 3 - 1) * 10, duration: 7.4, ease: "sine.inOut" }, 0));
      tl.fromTo("#light1", { x: -60, y: 10 }, { x: 130, y: -30, duration: 7.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#light2", { x: 80, y: 20 }, { x: -120, y: -40, duration: 7.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#scene", { scale: 1.04 }, { scale: 1, duration: 6, ease: "sine.out" }, 0);

      // 0.25 s: Aeri ribbon scales in softly
      tl.set("#ribbon", { x: 0, y: -125, scale: 0.19 }, 0);
      tl.to("#ribbon", { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.25);
      tl.to("#ribbon", { scale: 0.255, duration: 1.4, ease: "power3.out" }, 0.25);
      tl.to("#ribbon", { scale: 0.275, duration: 4.3, ease: "sine.inOut" }, 1.65);

      // 1.5 s: wordmark letter by letter (0.2 s step)
      tl.fromTo("#word span", { opacity: 0, y: 16, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power2.out", stagger: 0.2 }, 1.5);

      // 5.9 s: smooth outward exit, then fade to black by 7.4 s
      tl.to("#scene", { scale: 1.22, duration: 1.5, ease: "power2.in" }, 5.9);
      tl.to("#fade", { opacity: 1, duration: 1.3, ease: "power1.inOut" }, 6.1);
      window.__timelines["aeri-intro"] = tl;
    </script>
  </body>
</html>
