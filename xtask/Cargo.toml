[package]
name = "xtask"
description = "Developer tasks: assemble the macOS .app bundle; profile isolation checks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
cef = { version = "=156.6.0", default-features = false, features = ["build-util"] }
semver = "1"
serde_json = "1"
# DevTools protocol client for `cargo xtask isolation`.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
